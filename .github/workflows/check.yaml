name: Check if casks are up-to-date

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check_casks:
    name: Check casks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Update openvox8-agent cask
        run: bundle exec rake 'brew:cask[agent,8]'
      - name: Check if openvox8-agent is up-to-date
        run: git diff --exit-code

      - name: Update openvox9-agent cask
        run: bundle exec rake 'brew:cask[agent,9]'
      - name: Check if openvox9-agent is up-to-date
        run: git diff --exit-code


      - name: Update openvox8-openbolt cask
        run: bundle exec rake 'brew:cask[openbolt,8]'
      - name: Check if openvox8-openbolt is up-to-date
        run: git diff --exit-code
