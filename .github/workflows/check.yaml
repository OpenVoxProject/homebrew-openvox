name: Check if casks are up-to-date

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check_casks:
    name: Check casks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Regenerate all casks
        run: bundle exec rake 'brew:cask:all'
      - name: Check if casks are up-to-date
        run: git diff --exit-code
